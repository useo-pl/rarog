# Publishing the npm package (docs/publishing.md, "Publishing the npm package"). Run by hand only, with the
# version number, the package name and the dry-run mode. Three jobs:
#
# 1. build: typecheck, tests, the packer's tarball (`scripts/package.mjs`) and the mandatory audit of the tarball
#    against the build manifest (`scripts/package-audit.mjs`); tarball and manifest go out as an artifact, the
#    tarball's sha256 as an output;
# 2. sbom: on Ubuntu and macOS the tarball from build, its sha256 checked, `npm i -g` into a prefix, a CycloneDX SBOM
#    of the installed package as an artifact per platform;
# 3. publish (not in dry-run mode): the same tarball after the sha256 check, `npm stage publish` with the trusted
#    publisher's OIDC token. The version waits in the registry for approval with 2FA; the workflow approves nothing.
#
# Workflow-level permissions are empty; only the publish job, in the `npm` environment, has `id-token: write`. Job
# inputs and outputs reach the shell only through `env`. No secrets and no package manager cache (zizmor,
# `cache-poisoning`). Actions are pinned to the release SHA (comment: tag and release date).
name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version X.Y.Z; outside dry-run mode the workflow starts from the tag vX.Y.Z
        required: true
        type: string
      name:
        description: Package name in the npm registry
        required: true
        type: choice
        options:
          - '@rarog/server'
        default: '@rarog/server'
      dry-run:
        description: Dry-run mode, without the publish job
        required: true
        type: boolean
        default: true

permissions: {}

# One publication at a time; a run in progress is not cancelled when the next one starts.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Tarball and audit
    runs-on: ubuntu-latest
    # No server tests here: the release gate runs them on the same export tree, and the sha256 of this tarball is
    # compared with the tested candidate before the version is approved. `check.yml` runs them on the tag.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: inputs
        env:
          VERSION: ${{ inputs.version }}
          NAME: ${{ inputs.name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::input version: expected X.Y.Z"
            exit 1
          fi
          case "$NAME" in
            @rarog/server) ;;
            *)
              echo "::error::input name: only @rarog/server is allowed"
              exit 1
              ;;
          esac
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != "refs/tags/v$VERSION" ]]; then
            echo "::error::publishing starts from the tag v$VERSION (gh workflow run publish.yml --ref v$VERSION)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          # Full git history as in the Ubuntu job of `check.yml`: the same tests, the same checkout.
          fetch-depth: 0
          persist-credentials: false
      # npm >= 11.15 in Node 24 (`npm stage`); pnpm from `packageManager` in package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, 2026-10-08
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, 2026-09-05
      # The version in package.json = the input (= the tag). `repository.url` = the repository of this run: npm
      # rejects provenance from another repository, so a mismatch shows here, not after the build.
      - name: package.json
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          node -e "
            const pkg = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'));
            const [version, dryRun, repo] = process.argv.slice(1);
            const wanted = 'git+https://github.com/' + repo + '.git';
            if (pkg.version !== version) {
              console.log('::error::package.json version ' + pkg.version + ', input ' + version);
              process.exit(1);
            }
            if (pkg.repository?.url !== wanted) {
              console.log((dryRun === 'true' ? '::notice::' : '::error::') + 'repository.url '
                + pkg.repository?.url + ', repository of the run ' + wanted);
              if (dryRun !== 'true') process.exit(1);
            }
          " "$VERSION" "$DRY_RUN" "$GITHUB_REPOSITORY"
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm run typecheck
      - name: tarball
        id: pack
        env:
          VERSION: ${{ inputs.version }}
          NAME: ${{ inputs.name }}
        run: |
          node scripts/package.mjs --version "$VERSION" --name "$NAME" --out "$RUNNER_TEMP/paczka"
          base="${NAME#@}"
          base="${base/\//-}-$VERSION"
          if [ ! -f "$RUNNER_TEMP/paczka/$base.tgz" ] || [ ! -f "$RUNNER_TEMP/paczka/$base.build.json" ]; then
            echo "::error::the packer did not produce $base.tgz and $base.build.json"
            exit 1
          fi
          sha="$(shasum -a 256 "$RUNNER_TEMP/paczka/$base.tgz" | cut -d ' ' -f 1)"
          echo "tarball=$base.tgz" >>"$GITHUB_OUTPUT"
          echo "sha256=$sha" >>"$GITHUB_OUTPUT"
      # The file list audit is mandatory: `npm pack --dry-run --json` on the tarball and the tarball entries against
      # the build manifest (paths, sizes, file sha256, name, version, integrity, no Claude SDK).
      - name: tarball audit
        env:
          VERSION: ${{ inputs.version }}
          NAME: ${{ inputs.name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          node scripts/package-audit.mjs --name "$NAME" --version "$VERSION" \
            "$RUNNER_TEMP/paczka/$TARBALL" "$RUNNER_TEMP/paczka/${TARBALL%.tgz}.build.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, 2026-10-07
        with:
          name: paczka
          path: ${{ runner.temp }}/paczka/
          if-no-files-found: error
      - name: summary
        env:
          VERSION: ${{ inputs.version }}
          NAME: ${{ inputs.name }}
          DRY_RUN: ${{ inputs.dry-run }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          {
            echo "### $NAME@$VERSION"
            echo
            echo "- tarball: \`$TARBALL\`"
            echo "- sha256: \`$SHA256\`"
            echo "- dry run: $DRY_RUN"
          } >>"$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOM (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: {}
    steps:
      # npm 11 as in the publish job: with a package that bundles dependencies, npm 10 installs the iroh platform
      # packages of every system, and the SBOM would list them all.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, 2026-10-08
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm version
        run: |
          version="$(npm --version)"
          echo "npm $version"
          [ "${version%%.*}" -ge 11 ] || { echo "::error::npm $version: the SBOM needs npm >= 11"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, 2026-10-07
        with:
          name: paczka
          path: ${{ runner.temp }}/paczka
      - name: tarball sha256
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if [[ ! "$TARBALL" =~ ^[a-z0-9][a-z0-9._-]*\.tgz$ || ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::outputs of the build job: bad tarball name or sha256"
            exit 1
          fi
          echo "$SHA256  $RUNNER_TEMP/paczka/$TARBALL" | shasum -a 256 -c -
      # Installed as in the package smoke test: own prefix and cache, an empty npm config file, no scripts.
      # No lockfile on purpose (zizmor `adhoc-packages`): the SBOM describes what the user gets, the dependencies
      # outside the bundle resolved from the registry. The job has no permissions or secrets, and publish takes the
      # tarball from build.
      - name: npm i -g and SBOM
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: | # zizmor: ignore[adhoc-packages]
          w="$RUNNER_TEMP/sbom"
          mkdir -p "$w/cwd" "$w/out"
          : >"$w/empty-npmrc"
          export npm_config_userconfig="$w/empty-npmrc" npm_config_cache="$w/npm-cache"
          export npm_config_update_notifier=false
          cd "$w/cwd"
          npm i -g --prefix "$w/prefix" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/paczka/$TARBALL"
          platform="$(echo "$RUNNER_OS-$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          sbom="$w/out/${TARBALL%.tgz}.$platform.cdx.json"
          (cd "$w/prefix/lib/node_modules/$NAME" && npm sbom --sbom-format cyclonedx --sbom-type application) >"$sbom"
          node -e "
            const bom = JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'));
            const [name, version] = process.argv.slice(2);
            const names = (bom.components ?? []).map((one) => (one.group ? one.group + '/' : '') + one.name);
            const problems = [];
            if (bom.bomFormat !== 'CycloneDX') problems.push('bomFormat ' + bom.bomFormat);
            const component = bom.metadata?.component ?? {};
            if (component.name !== name || component.version !== version) {
              problems.push('metadata.component ' + component.name + '@' + component.version);
            }
            if (names.some((one) => one.startsWith('@anthropic-ai/'))) problems.push('Claude SDK in the SBOM');
            console.log('SBOM: ' + names.length + ' packages: ' + names.join(', '));
            if (problems.length > 0) {
              console.log('::error::SBOM: ' + problems.join('; '));
              process.exit(1);
            }
          " "$sbom" "$NAME" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, 2026-10-07
        with:
          name: sbom-${{ matrix.os }}
          path: ${{ runner.temp }}/sbom/out/
          if-no-files-found: error

  publish:
    name: npm stage publish
    needs: [build, sbom]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment `npm`: only `v*` tags and the owner's approval before the job starts; the trusted publisher in the
    # registry accepts a token only from this workflow in this environment.
    environment: npm
    permissions:
      id-token: write
    steps:
      # Node 24 with its bundled npm >= 11.15; no `registry-url` (an `.npmrc` file with a token) and no `npm i -g npm`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, 2026-10-08
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm version
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e "
            const [major, minor] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 15)) process.exit(1);
          " "$version" || { echo "::error::npm $version: npm stage needs >= 11.15"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, 2026-10-07
        with:
          name: paczka
          path: ${{ runner.temp }}/paczka
      - name: tarball sha256
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if [[ ! "$TARBALL" =~ ^[a-z0-9][a-z0-9._-]*\.tgz$ || ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::outputs of the build job: bad tarball name or sha256"
            exit 1
          fi
          echo "$SHA256  $RUNNER_TEMP/paczka/$TARBALL" | shasum -a 256 -c -
      # An empty working directory and an empty npm config file: the default registry, token and provenance from OIDC.
      - name: npm stage publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          w="$RUNNER_TEMP/stage"
          mkdir -p "$w/cwd"
          : >"$w/empty-npmrc"
          cd "$w/cwd"
          npm_config_userconfig="$w/empty-npmrc" npm_config_cache="$w/npm-cache" npm_config_update_notifier=false \
            npm stage publish "$RUNNER_TEMP/paczka/$TARBALL" --ignore-scripts
      - name: summary
        env:
          VERSION: ${{ inputs.version }}
          NAME: ${{ inputs.name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          {
            echo "### $NAME@$VERSION is waiting in the registry (staged)"
            echo
            echo "Tarball sha256: \`$SHA256\`. Approval: \`npm stage list $NAME\`, \`npm stage download\`,"
            echo "a comparison with your own build, \`npm stage approve\` with 2FA."
          } >>"$GITHUB_STEP_SUMMARY"
