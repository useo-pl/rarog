# Retencja dziennika na VPS relaya: /etc/systemd/journald.conf.d/60-iroh-relay.conf (install.sh). Linie relaya
# i adaptera niosą adres IP klienta i skrót EndpointId, więc dziennik żyje najwyżej ok. 8 dni: plik dziennika
# zamyka się co dobę, a pliki starsze niż 7 dni znikają.
[Journal]
MaxFileSec=1day
MaxRetentionSec=7day
