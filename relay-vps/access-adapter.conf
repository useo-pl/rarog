# Adapter haka (access-adapter.mjs). Na VPS: /etc/iroh-relay/access-adapter.conf, 0644, bez sekretu: bearer przychodzi
# od relaya w nagłówku i adapter tylko go przekazuje. Gdy Worker rejestru nie odpowiada (także gdy go nie ma),
# adapter po ADAPTER_DEADLINE_MS odpowiada `true`, czyli relay wpuszcza każdego.
WORKER_URL=https://relay-auth.rarog.ai/v1/access
ADAPTER_HOST=127.0.0.1
ADAPTER_PORT=8081
ADAPTER_DEADLINE_MS=3000
ADAPTER_NEG_TTL_MS=15000
