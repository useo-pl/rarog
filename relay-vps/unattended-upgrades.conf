// Relay iroh: restart po aktualizacji wymagającej rebootu, w nocy. Na VPS: /etc/apt/apt.conf.d/52iroh-relay-reboot
// (install.sh); nadpisuje wartości z 50unattended-upgrades. Po reboocie qdisc wraca przed relayem (relay-tc.service).
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
