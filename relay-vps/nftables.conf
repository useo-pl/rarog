#!/usr/sbin/nft -f
# Budżet połączeń relaya iroh. Na VPS: /etc/nftables.conf (nftables.service). Polityka accept: reguły tylko
# limitują NOWE połączenia do usług relaya, reszta ruchu przechodzi bez zmian.
#   tcp 443  relay (WSS) i ACME TLS-ALPN-01
#   tcp 80   sonda portalu przechwytującego klienta (GET /generate_204)
#   udp 7842 QAD (QUIC address discovery)
# Limity na adres liczą IPv4 per adres, a IPv6 per /64: jedno łącze dostaje od dostawcy całą /64, więc pełny
# adres dawałby tyle liczników, ile adresów w puli.
flush ruleset

table inet relay {
	# na adres: tempo nowych połączeń (10/s) i równoczesne TCP (50: biuro, hotel, CGNAT za jednym adresem)
	set rate4 { type ipv4_addr; size 65536; flags dynamic,timeout; timeout 60s; }
	set rate6 { type ipv6_addr; size 65536; flags dynamic,timeout; timeout 60s; }
	set conn4 { type ipv4_addr; size 65536; flags dynamic; }
	set conn6 { type ipv6_addr; size 65536; flags dynamic; }
	set udp4 { type ipv4_addr; size 65536; flags dynamic,timeout; timeout 60s; }
	set udp6 { type ipv6_addr; size 65536; flags dynamic,timeout; timeout 60s; }

	chain input {
		type filter hook input priority filter; policy accept;
		iif "lo" accept
		# SSH tylko z tailnetu, przed limitami relaya. Tailscale działa na VPS z --netfilter-mode=off, więc
		# reguły trzyma tylko ten plik; iifname (nazwa, nie indeks) działa też wtedy, gdy interfejs wstaje po zaporze.
		# install.sh odmawia wgrania tego pliku, gdy Tailscale nie działa.
		iifname "tailscale0" tcp dport 22 accept
		tcp dport 22 drop
		tcp dport { 80, 443 } ct state new jump relay_tcp
		udp dport 7842 ct state new jump relay_udp
	}

	chain relay_tcp {
		add @rate4 { ip saddr limit rate over 10/second burst 10 packets } counter drop comment "na adres 10/s (v4)"
		add @rate6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 10/second burst 10 packets } counter drop comment "na /64 10/s (v6)"
		add @conn4 { ip saddr ct count over 50 } counter reject with tcp reset comment "na adres 50 równoczesnych (v4)"
		add @conn6 { ip6 saddr & ffff:ffff:ffff:ffff:: ct count over 50 } counter reject with tcp reset comment "na /64 50 równoczesnych (v6)"
		ct count over 8000 counter reject with tcp reset comment "globalnie 8000 równoczesnych"
		limit rate over 50/second burst 50 packets counter drop comment "globalnie 50/s nowych"
		counter accept
	}

	chain relay_udp {
		add @udp4 { ip saddr limit rate over 10/second burst 10 packets } counter drop comment "QAD na adres 10/s (v4)"
		add @udp6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 10/second burst 10 packets } counter drop comment "QAD na /64 10/s (v6)"
		limit rate over 50/second burst 50 packets counter drop comment "QAD globalnie 50/s nowych"
		counter accept
	}
}
