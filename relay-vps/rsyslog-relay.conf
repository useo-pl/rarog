# Dziennik relaya i adaptera tylko w journald (retencja 7 dni, journald-relay.conf), nie w /var/log/syslog, który
# logrotate trzyma 4 tygodnie. Na VPS: /etc/rsyslog.d/10-iroh-relay.conf (install.sh), przed 50-default.conf.
# Alerty (tag relay-alert) idą do sysloga jak dotąd.
if $programname == 'iroh-relay' or $programname == 'relay-access' then stop
